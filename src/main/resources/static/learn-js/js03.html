<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
  // 함수 1 : named
  function action1() {
    console.log("이름 있는 함수");
  }
  // const afunc = function action1() {
  //   console.log("이름 있는 함수");
  // }

  // 함수 2 : anonymous
  const bfunc = function() {
    console.log("이름 없는 함수");
  }

  // 함수 3 : arrow function
  const cfunc = () => {
    console.log("arrow function");
  };

  // 함수는 값, 변수에 할당(대입) 할 수 있다.

  // 함수 실행
  action1();
  // afunc();
  bfunc();
  cfunc();

  const xfunc = action1;
  const yfunc = bfunc;
  const zfunc = cfunc;

</script>

</body>
</html>
