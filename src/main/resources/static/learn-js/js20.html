<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
  const action1 = () => {
    new Promise((resolve, reject) => {
      setTimeout(() => {
        const number = Math.random();
        if (number < 0.5) {   // 50% 확률
          resolve("결과");
        } else {
          reject("에러");
        }
      }, 3000);
    });
  };

  function wrapping1() {
    action1()                                 // 3초
            .then(res => console.log(res))    // 성공(resolve)
            .catch(err => console.log(err));  // 실패(reject)

    console.log("어떤 실행 코드 ");           // action1() 보다 먼저 실행된다.
  }
  wrapping1();
  // await : 비동기 코드를 동기(sync) 코드처럼 사용가능
  // await 코드는 async 함수 내에 있어야 한다.
  async function wrapping2() {
    const a = await action1();    // action1() 종료 후 다음 코드 실행
    console.log(a);               // action1()
    console.log("또다른 실행 코드"); // action1()이 종료되면 실행
  }
  wrapping2();

</script>

</body>
</html>
