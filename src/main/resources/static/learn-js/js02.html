<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<script>
  // js 주석
  /*
  여러 줄 주석
   */
  // console.log에 출력
  console.log("콘솔 출력");

  // 변수 선언
  let a;
  // 값 대입(할당)
  a = 33;
  console.log(a);
  a = 44;
  console.log(a);

  // 상수(변하지 않는 값, 선언 시 한번만 할당)
  const b = 33;
  // b = 33;
  console.log(b);
  // b = 55;

  // const 먼저 사용 후 필요하면 let으로 변경해서 사용





</script>
</body>
</html>
