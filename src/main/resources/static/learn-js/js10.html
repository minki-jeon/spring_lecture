<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
  // 객체 복사 - 참조값 복사
  const a = {name: "son", age: 55, address: "london"}
  const b = a;
  b.name = "lee";
  console.log(b);
  console.log(a);

  // 객체 복사(1), 잘 사용되지 않는 방법
  const c = {};
  c.name = a.name;
  c.age = a.age;
  c.address = a.address;
  console.log(c);

  // 객체 복사(2), 간혹 사용되는 방법
  const d = {name: a.name, age: a.age, address: a.address};
  console.log(d);

  // spread 연산자, 자주 사용되는 방법
  const e = {...a};
  console.log(e);

  const f = {...a, city: "seoul"}; // 속성 추가
  console.log(f);   // {name: "son", age: 55, address: "london",  city: "seoul"}
  const g = {...a, name: "kim"};  // 속성 변경
  console.log(g);   // {name: "kim", age: 55, address: "london"}

  const h = {email: "gmail", score: 99.22, city: "seoul"};
  const i = {...h};
  const j = {...h, country: "korea"};
  const k = {...h, score: 88.11};
  console.log(i);   //{email: "gmail", score: 99.22, city: "seoul"}
  console.log(j);   //{email: "gmail", score: 99.22, city: "seoul", country: "korea"}
  console.log(k);   //{email: "gmail", score: 88.11, city: "seoul"}




</script>
</body>
</html>
